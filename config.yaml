# Alle instelbare parameters van gold-signals.
# Timeframe-namen overal: "1d" (daily), "4h", "1h".

data:
  provider: dukascopy
  instrument: "XAU/USD"
  offer_side: bid            # bid of ask; TradingView-brokers tonen meestal bid
  years: 5                   # hoeveel jaar terug, als start_date leeg is
  # Vaste startdatum (= begin warm-up), zodat ATR/EMA in backtest en live precies
  # dezelfde historie hebben.
  start_date: "2020-10-01"   # overschrijft 'years'
  end_date: null             # null = tot nu
  cache_dir: data/cache
  # Goud-conventie: de daily candle sluit om 17:00 New York-tijd.
  # De 4h-candles worden op dezelfde sessiestart uitgelijnd (17, 21, 01, 05, 09, 13 NY),
  # zodat zes 4h-candles precies in een daily candle passen.
  session_tz: America/New_York
  session_close_hour: 17

timeframes: ["1d", "4h", "1h"]

zones:
  atr_period: 14
  # Fractal-venster: een swing high moet hoger zijn dan n candles links en rechts.
  # Hij is dus pas n candles NA vorming bekend (bevestiging).
  pivot_window:
    1d: 3
    4h: 5
    1h: 5
  # Alleen pivots uit de laatste N gesloten candles van die timeframe gebruiken.
  lookback_bars:
    1d: 1250    # ~5 jaar
    4h: 1500    # ~1 jaar
    1h: 1500    # ~3 maanden
  min_touches: 2             # zone telt pas mee vanaf zoveel pivots
  # Recency: een aanraking telt 1 als hij net gebeurd is, 0.5 na een halfwaardetijd.
  half_life_days:
    1d: 365
    4h: 90
    1h: 21

  # Methode A: pivot-clustering
  cluster:
    tolerance_atr: 0.5       # k: pivots binnen k x ATR horen bij dezelfde zone
    padding_atr: 0.1         # zone aan beide kanten iets oprekken

  # Methode B: kernel density (KDE)
  kde:
    bandwidth_atr: 0.25      # bandbreedte van de kernel, in ATR van die timeframe
    halfwidth_bw: 1.0        # zone = piek +/- halfwidth_bw x bandbreedte
    min_prominence: 0.05     # piek moet minstens 5% van de hoogste piek uitsteken
    grid_step_atr: 0.02      # resolutie van het prijsraster

merge:
  timeframe_weights:
    1d: 3
    4h: 2
    1h: 1

output:
  dir: output
  max_distance_pct: 10       # top-zones en Pine-export: alleen zones binnen 10% van de prijs
  chart_timeframe: 4h
  chart_months: 3
  chart_max_zones: 15        # max aantal zones in de HTML-chart (sterkste eerst)
  pine_top_n: 20
  pine_method: A             # welke methode naar TradingView gaat (A of B)
  colors:                    # kleur per timeframe (kleurenblind-veilig gevalideerd)
    1d: "#2a78d6"
    4h: "#eb6834"
    1h: "#1baf7a"

# ---------------------------------------------------------------------------
# Vanaf hier: onderzoek, backtest, paper trading (fase A-F)
# ---------------------------------------------------------------------------

# Vaste data-indeling (zie research/PLAN.md). NIET verschuiven als er nieuwe data komt.
periods:
  warmup_start: "2020-10-01"   # alleen historie, er wordt niets op gemeten
  research_start: "2021-10-01"
  holdout_start: "2025-10-01"  # = einde research (exclusief)
  holdout_end: "2026-10-01"    # = begin forward/paper (exclusief)

# Indicatoren (allemaal causaal: alleen verleden)
features:
  atr_period: 14
  rsi_period: 14
  ema_fast: 50               # 1h
  ema_slow: 200              # 1h
  daily_trend_ema: 50        # trend = slot laatste gesloten daily > EMA50(daily)
  vol_lookback_days: 365     # volatiliteitsregime: ATR-percentiel t.o.v. dit venster
  vol_low_pct: 33
  vol_high_pct: 67

# Zones per uur, eenmalig berekend via zones_as_of en opgeslagen
snapshots:
  dir: data/snapshots
  methods: ["A", "B"]
  workers: 8

# Kosten per ounce (USD). Round trip = spread + 2 x slippage.
costs:
  spread_usd: 0.40
  slippage_usd: 0.10
  sensitivity_multipliers: [0, 1, 2, 3]

research:
  seed: 42
  method: A                  # primaire zone-methode
  horizon_bars: 24           # uitkomst over de volgende N 1h-candles
  bounce_atr: 1.0            # bounce: >= 1 ATR weg van de zone
  break_atr: 0.5             # break: slot >= 0.5 ATR voorbij de zone
  setup_stop_atr: 0.25       # stop = verre zonekant -/+ 0.25 ATR
  setup_rr: 2.0
  setup_max_bars: 48
  setup_min_risk_atr: 0.25
  repeat_window_bars: 120    # 'herhaalde test' = event op overlappende zone in de 120 candles ervoor
  retest_window_bars: 48     # V4: retest binnen 48 candles na een break
  null_replicates: 200
  null_replicates_splits: 50
  null_offset_min_atr_1d: 1.0
  null_offset_max_atr_1d: 4.0
  bootstrap_n: 2000
  sessions_utc:              # [start, eind) in UTC-uren
    asia: [21, 7]
    london: [7, 12]
    newyork: [12, 21]
  rsi_long_max: 40
  rsi_short_min: 60
  rejection_wick_frac: 0.5
  output_dir: research

# Fictief account (paper trading en backtest). NOOIT echt geld, geen broker.
account:
  start_equity_eur: 10000
  risk_pct: 1.0              # risico per trade, % van de equity bij entry
  eurusd: 1.10               # alleen om het aantal ounces te tonen; P/L in euro = R x risico
  max_open_per_strategy: 1

# Walk-forward binnen de research-periode
walkforward:
  train_months: 12
  test_months: 3
  step_months: 3

optuna:
  trials_per_window: 20      # max aantal varianten per venster (dubbele tellen niet)
  seed: 7
  min_train_trades: 15       # minder trades in het train-venster = ongeldige variant

validation:
  min_trades_research: 100   # walk-forward test-trades samen
  min_trades_holdout: 30
  dsr_threshold: 0.95        # deflated Sharpe: >= 95% zeker beter dan de beste toevalsvariant

# Paper trading (elk uur). State staat op de git-branch 'state' (map state/).
paper:
  state_dir: state
  max_catchup_candles: 72    # na een storing max zoveel gemiste candles naspelen
  data_retries: 3            # pogingen als de laatste candle nog niet bij Dukascopy staat
  data_wait_seconds: 60
  late_after_hours: 2        # signaal ouder dan dit: melding krijgt 'vertraagd'
  deviation_min_trades: 10   # waarschuwing live vs backtest pas vanaf zoveel live trades
  deviation_z: 2.0           # ... en als live > 2 standaardfouten slechter is

# Meldingen (Telegram). Token en chat-id NIET hier: alleen .env / GitHub Secrets.
notify:
  timezone: Europe/Amsterdam
  dashboard_url: "https://vogelaardille.github.io/gold-signals/"
  zone_alert:
    enabled: true
    method: A
    max_distance_atr: 0.5    # koers binnen 0.5 x ATR(1h) van de zone
    min_score: 5.0           # alleen zones met score >= drempel
    cooldown_hours: 12       # max 1 melding per zone per 12 uur
  signal:
    enabled: true
    chart: true              # PNG-chart meesturen
  trade_update:
    enabled: true
  system:
    enabled: true
    cooldown_hours: 6
  weekly:
    enabled: true
    weekday: 6               # 6 = zondag
    hour_local: 19           # vanaf 19:00 Amsterdam-tijd
